[package]
name = "katanakit-sysli"
version = "0.2.0"
edition = "2021"
description = "lazysystemd para el ecosistema systemd: units + timers + journal + boot + networkd/logind/udevd. Sin sudo total, polkit por accion."
license = "MIT"
repository = "https://github.com/senseikatana/katanakit-sysli"
keywords = ["systemd", "tui", "ratatui", "dbus", "sysadmin"]
categories = ["command-line-utilities"]

[[bin]]
name = "ksys"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"

[dev-dependencies]
pretty_assertions = "1"
