services:
  - type: static_site
    name: katanakit-docs
    branch: deploy
    buildCommand: yarn install && yarn run docs:build
    staticPublishPath: ./docs/build
    nodeVersion: 22.18.0
    domains:
      - senseikatana.com
    headers:
      - path: "/*"
        name: X-Frame-Options
        value: DENY
      - path: "/*"
        name: X-Content-Type-Options
        value: nosniff
