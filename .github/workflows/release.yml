name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v2.3.0). Leave empty to auto-detect."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh "${{ inputs.version }}"
