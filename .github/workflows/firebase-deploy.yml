# ============================================================
#  firebase-deploy.yml — Build demo and deploy to Firebase Hosting
#
#  On push to main:
#    1. Builds CSS artifact (npm package)
#    2. Builds Vite demo site (demo/ → demo/dist/)
#    3. Deploys demo/dist to Firebase Hosting (live channel)
#
#  Required secret: FIREBASE_SERVICE_ACCOUNT_KATANAKIT_CSS
#  (JSON key of github-action-deployer@katanakit-css service account)
# ============================================================
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@a71fae5e8f87e4b87c5cc63b5a70036845438c94  # v4.0.0
        with:
          version: 9

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CSS artifact
        run: pnpm build:css

      - name: Build demo site
        run: pnpm demo:build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KATANAKIT_CSS }}
          channelId: live
          projectId: katanakit-css
