# ============================================================
#  deploy-docs.yml — Build Docusaurus docs and deploy to gh-pages
#
#  On push to main:
#    1. Builds CSS artifact (npm package)
#    2. Builds Docusaurus site (docs/)
#    3. Deploys docs/build to gh-pages branch
# ============================================================
name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install root dependencies
        run: corepack enable && yarn install --frozen-lockfile

      - name: Build CSS artifact (npm)
        run: yarn build:css

      - name: Install docs dependencies
        run: cd docs && yarn install --frozen-lockfile

      - name: Build Docusaurus site
        run: cd docs && yarn build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/build
          force_orphan: true
