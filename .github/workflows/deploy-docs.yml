# ============================================================
#  deploy-docs.yml — Build Docusaurus docs and deploy to gh-pages
#
#  On push to main:
#    1. Builds CSS artifact (npm package)
#    2. Builds Docusaurus site (docs/)
#    3. Deploys docs/build to gh-pages branch
# ============================================================
name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a71fae5e8f87e4b87c5cc63b5a70036845438c94  # v4.0.0
        with:
          version: 9

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CSS artifact (npm)
        run: pnpm build:css

      - name: Install docs dependencies
        run: cd docs && pnpm install --frozen-lockfile

      - name: Build Docusaurus site
        run: cd docs && pnpm build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/build
          force_orphan: true
