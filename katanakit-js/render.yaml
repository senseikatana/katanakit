services:
 - type: static_site
   name: katanakit-guides
   branch: deploy
   buildCommand: bun install && bun run guides:build
   staticPublishPath: ./guides/build
   nodeVersion: 22.18.0
   domains:
    - senseikatana.com
   headers:
    - path: "/*"
      name: X-Frame-Options
      value: DENY
    - path: "/*"
      name: X-Content-Type-Options
      value: nosniff
