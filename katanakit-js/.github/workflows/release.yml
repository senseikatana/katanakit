# Trusted Publishing (OIDC) — no long-lived NPM_TOKEN needed.
# PREREQUISITE: configure trusted publishing on npmjs.com:
#   npmjs.com → Package Settings → Publishing access → Trusted publishing
#   → Add: repo=senseikatana/katanakit, workflow=release.yml, environment=(none)
# Without this, `npm publish --provenance` fails with 401/403.
name: Release

on:
 workflow_dispatch:
  inputs:
   release-type:
    description: "Release type"
    required: true
    type: choice
    options:
     - patch
     - minor
     - major

permissions:
 contents: write
 id-token: write

jobs:
 release:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
     with:
      fetch-depth: 0

   - uses: oven-sh/setup-bun@v2

   - uses: actions/setup-node@v4
     with:
      node-version: 24
      registry-url: "https://registry.npmjs.org"

   - run: bun install --frozen-lockfile

   - run: bun run build

   - run: bun run bump:${{ inputs.release-type }}

   - run: npm publish --provenance --access public

   - run: git push && git push --tags

   - run: |
      VERSION=$(node -p "require('./package.json').version")
      NOTES=$(node scripts/generate-release-notes.mjs "v${VERSION}")
      echo "$NOTES" > /tmp/release-notes.md

   - run: |
      VERSION=$(node -p "require('./package.json').version")
      gh release create "v${VERSION}" \
        --title "v${VERSION}" \
        --notes-file /tmp/release-notes.md
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
